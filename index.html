<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradeCalc Pro | ayoub BRKN</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="page-layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon"><i class="fas fa-calculator"></i></div>
                <h2>Grade<span>Calc</span></h2>
            </div>
            <nav class="side-nav">
                <button onclick="switchSemester(1)" id="btnS1" class="nav-item active">
                    <i class="fas fa-layer-group"></i> <span>السداسي الأول</span>
                </button>
                <button onclick="switchSemester(2)" id="btnS2" class="nav-item">
                    <i class="fas fa-layer-group"></i> <span>السداسي الثاني</span>
                </button>
            </nav>
            <div class="creator-badge">
                <p>المطور</p>
                <span>ayoub BRKN</span>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="header-text">
                    <h1 id="semesterTitle">السداسي الأول</h1>
                    <p>نظام الحساب المعتمد (60/40)</p>
                </div>
                <div class="header-actions">
                    <button onclick="resetForm()" class="btn-secondary">مسح الكل</button>
                    <button onclick="calculate()" class="btn-primary">حساب المعدل</button>
                </div>
            </header>

            <div class="dashboard-grid">
                <div class="input-panel">
                    <section class="pro-card">
                        <div class="card-title"><i class="fas fa-edit"></i> الامتحانات (60%)</div>
                        <div class="input-grid" id="examFields">
                            </div>
                    </section>

                    <section class="pro-card">
                        <div class="card-title"><i class="fas fa-tools"></i> TD & TP (40%)</div>
                        <div class="input-grid" id="tdFields">
                            </div>
                    </section>
                </div>

                <div class="sidebar-results">
                    <div class="result-sticky-card">
                        <span class="res-label">المعدل العام</span>
                        <div class="main-score" id="finalMoyen">0.00</div>
                        <div class="status-box" id="message">بانتظار العلامات...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
