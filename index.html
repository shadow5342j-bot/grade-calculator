<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GradeCalc Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div class="app-wrapper">
        <header class="main-header">
            <div class="logo">Grade<span>Calc</span></div>
            <div class="quick-controls">
                <button onclick="toggleTheme()" class="circle-btn"><i id="themeIcon" class="fas fa-sun"></i></button>
                <button onclick="toggleLanguage()" class="circle-btn"><i class="fas fa-language"></i></button>
            </div>
        </header>

        <div class="main-layout">
            <nav class="side-menu">
                <button onclick="switchSemester(1)" id="btnS1" class="menu-item active">
                    <i class="fas fa-layer-group"></i> <span class="lang-txt" data-ar="السداسي 1" data-en="Semester 1">السداسي 1</span>
                </button>
                <button onclick="switchSemester(2)" id="btnS2" class="menu-item">
                    <i class="fas fa-layer-group"></i> <span class="lang-txt" data-ar="السداسي 2" data-en="Semester 2">السداسي 2</span>
                </button>
            </nav>

            <main class="content-body">
                <div class="grid-container">
                    <div class="inputs-section">
                        <div class="pro-card">
                            <h3 class="lang-txt" data-ar="الامتحانات" data-en="Exams">الامتحانات</h3>
                            <div class="input-grid" id="examFields"></div>
                        </div>
                        <div class="pro-card">
                            <h3 class="lang-txt" data-ar="الأعمال الموجهة" data-en="TD & TP">الأعمال الموجهة</h3>
                            <div class="input-grid" id="tdFields"></div>
                        </div>
                    </div>

                    <div class="results-section">
                        <div class="result-card">
                            <span class="lang-txt" data-ar="المعدل العام" data-en="GPA">المعدل العام</span>
                            <div class="score" id="finalMoyen">0.00</div>
                            <div id="statusIndicator" class="badge">---</div>
                            <button onclick="calculate()" class="calc-btn lang-txt" data-ar="احسب النتيجة" data-en="Calculate">احسب النتيجة</button>
                            <button onclick="resetForm()" class="reset-link lang-txt" data-ar="إعادة تعيين" data-en="Reset">إعادة تعيين</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
