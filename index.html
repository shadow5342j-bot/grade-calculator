<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester AVG Calculator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/your-font-awesome-kit-id.js" crossorigin="anonymous"></script> 
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">
    <header class="header">
        <div class="header-title">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <h1 class="app-title">Calculator <span>[Your Name]</span></h1>
        </div>
        <div class="controls">
            <div class="toggle-control" id="theme-toggle" onclick="toggleTheme()">
                <div class="toggle-option" id="theme-light">
                    <i class="fa-solid fa-sun"></i>
                </div>
                <div class="toggle-option active" id="theme-dark">
                    <i class="fa-solid fa-moon"></i>
                </div>
            </div>
            <div class="toggle-control" id="lang-toggle" onclick="toggleLang()">
                <div class="toggle-option active" id="lang-en">EN</div>
                <div class="toggle-option" id="lang-ar">ع</div>
            </div>
        </div>
    </header>
    
    <main class="calculator-card">
        <div class="section-header">
            <h2 class="section-title" data-i18n="chooseSem">Select Your Semester</h2>
            <div class="toggle-control" id="sem-toggle" onclick="toggleSemester()">
                <div class="toggle-option active" id="sem1" data-i18n="sem1Short">S1</div>
                <div class="toggle-option" id="sem2" data-i18n="sem2Short">S2</div>
            </div>
        </div>

        <div id="grades-form" class="subject-container">
            <div class="subject-card">
                <div class="subject-name"><i class="fa-solid fa-chart-line"></i> <span data-i18n="subjAnalyse">Analyse</span></div>
                <div class="input-grid">
                    <div class="field-group"><label data-i18n="td">TD Note</label><div class="field-input-wrapper"><input type="number" id="a_td" step="0.01" placeholder="0.00"><i class="fa-solid fa-user-edit"></i></div></div>
                    <div class="field-group"><label data-i18n="exam">Exam Note</label><div class="field-input-wrapper"><input type="number" id="a_ex" step="0.01" placeholder="0.00"><i class="fa-solid fa-file-signature"></i></div></div>
                </div>
            </div>

            <div class="subject-card">
                <div class="subject-name"><i class="fa-solid fa-subscript"></i> <span data-i18n="subjAlgebra">Algebra</span></div>
                <div class="input-grid">
                    <div class="field-group"><label data-i18n="td">TD Note</label><div class="field-input-wrapper"><input type="number" id="g_td" step="0.01" placeholder="0.00"><i class="fa-solid fa-user-edit"></i></div></div>
                    <div class="field-group"><label data-i18n="exam">Exam Note</label><div class="field-input-wrapper"><input type="number" id="g_ex" step="0.01" placeholder="0.00"><i class="fa-solid fa-file-signature"></i></div></div>
                </div>
            </div>

            <div class="subject-card">
                <div class="subject-name"><i class="fa-solid fa-atom"></i> <span data-i18n="subjPhysics">Physics</span></div>
                <div class="input-grid">
                    <div class="field-group"><label data-i18n="td">TD Note</label><div class="field-input-wrapper"><input type="number" id="ph_td" step="0.01" placeholder="0.00"><i class="fa-solid fa-user-edit"></i></div></div>
                    <div class="field-group"><label data-i18n="exam">Exam Note</label><div class="field-input-wrapper"><input type="number" id="ph_ex" step="0.01" placeholder="0.00"><i class="fa-solid fa-file-signature"></i></div></div>
                    <div class="field-group tp-field"><label data-i18n="tp">TP Note</label><div class="field-input-wrapper"><input type="number" id="tpph" step="0.01" placeholder="0.00"><i class="fa-solid fa-flask"></i></div></div>
                </div>
            </div>

            <div class="subject-card">
                <div class="subject-name"><i class="fa-solid fa-vial"></i> <span data-i18n="subjChemistry">Chemistry</span></div>
                <div class="input-grid">
                    <div class="field-group"><label data-i18n="td">TD Note</label><div class="field-input-wrapper"><input type="number" id="ch_td" step="0.01" placeholder="0.00"><i class="fa-solid fa-user-edit"></i></div></div>
                    <div class="field-group"><label data-i18n="exam">Exam Note</label><div class="field-input-wrapper"><input type="number" id="ch_ex" step="0.01" placeholder="0.00"><i class="fa-solid fa-file-signature"></i></div></div>
                    <div class="field-group tp-field"><label data-i18n="tp">TP Note</label><div class="field-input-wrapper"><input type="number" id="tpch" step="0.01" placeholder="0.00"><i class="fa-solid fa-eye-dropper"></i></div></div>
                </div>
            </div>

            <div class="subject-card">
                <div class="subject-name"><i class="fa-solid fa-desktop"></i> <span data-i18n="subjInfo">Informatique</span></div>
                <div class="input-grid">
                    <div class="field-group"><label data-i18n="td">TD Note</label><div class="field-input-wrapper"><input type="number" id="in_td" step="0.01" placeholder="0.00"><i class="fa-solid fa-user-edit"></i></div></div>
                    <div class="field-group"><label data-i18n="exam">Exam Note</label><div class="field-input-wrapper"><input type="number" id="in_ex" step="0.01" placeholder="0.00"><i class="fa-solid fa-file-signature"></i></div></div>
                </div>
            </div>

            <div id="sem1-only" class="subject-container" style="grid-column: 1 / -1; margin-bottom: 0;">
                <div class="subject-card">
                    <div class="subject-name"><i class="fa-solid fa-balance-scale"></i> <span data-i18n="subjEthique">Ethique</span></div>
                    <div class="input-grid">
                        <div class="field-group tp-field"><label data-i18n="examOnly">Final Note</label><div class="field-input-wrapper"><input type="number" id="et" step="0.01" placeholder="0.00"><i class="fa-solid fa-award"></i></div></div>
                    </div>
                </div>
                <div class="subject-card">
                    <div class="subject-name"><i class="fa-solid fa-tools"></i> <span data-i18n="subjMetiers">Les métiers</span></div>
                    <div class="input-grid">
                        <div class="field-group tp-field"><label data-i18n="examOnly">Final Note</label><div class="field-input-wrapper"><input type="number" id="l" step="0.01" placeholder="0.00"><i class="fa-solid fa-award"></i></div></div>
                    </div>
                </div>
            </div>

            <div id="sem2-only" class="subject-container hidden" style="grid-column: 1 / -1; margin-bottom: 0;">
                <div class="subject-card">
                    <div class="subject-name"><i class="fa-solid fa-code-branch"></i> <span data-i18n="subjFreeSoft">Free Software</span></div>
                    <div class="input-grid">
                        <div class="field-group"><label data-i18n="td">TD Note</label><div class="field-input-wrapper"><input type="number" id="f_td" step="0.01" placeholder="0.00"><i class="fa-solid fa-user-edit"></i></div></div>
                        <div class="field-group"><label data-i18n="exam">Exam Note</label><div class="field-input-wrapper"><input type="number" id="f_ex" step="0.01" placeholder="0.00"><i class="fa-solid fa-file-signature"></i></div></div>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-calculate" onclick="calculate()" data-i18n="btnCalc">Calculate Final Average</button>

        <div id="result-panel" class="result-panel">
            <div class="result-message-area">
                <div class="result-title" id="result-title"></div>
                <div class="result-subtitle" id="result-subtitle" data-i18n="resultMsg">Your final average for this semester is:</div>
            </div>
            <div class="avg-badge">
                <span id="final-avg-value">0.00</span>
                <span data-i18n="avgLabel">Average</span>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
